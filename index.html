<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yabi Defense - 자동 공격 범위 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1d2230;
      color: white;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    .app { width: min(960px, 100%); padding: 20px; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 14px; color: #cbd2e3; line-height: 1.5; }
    .canvas-wrap {
      overflow: hidden;
      border: 1px solid #46506a;
      border-radius: 14px;
      background: #eef7ff;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
      touch-action: none;
    }
    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #2a3142;
      color: #ffe3a3;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Yabi Defense 자동 공격 테스트</h1>
    <p>
      빨간 몬스터를 드래그해 공격 범위 안팎으로 이동해보세요.
      몬스터가 범위 안에 있을 때만 불정령이 자동으로 회전 공격합니다.
    </p>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="900" height="560"></canvas>
    </div>

    <div id="status" class="status">이미지를 불러오는 중...</div>
  </main>

  <script src="game.js"></script>
</body>
</html>
